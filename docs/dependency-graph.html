<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zhiyun-pro-js · 插件依赖图</title>
<style>
  :root{
    --bg:#eef2f7; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --line:#d7dee9; --hard:#2563eb; --lazy:#d97706; --import:#0891b2; --host:#94a3b8;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 14px 36px -14px rgba(15,23,42,.22);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --panel:#111a2b; --ink:#e6edf7; --muted:#93a4bd; --faint:#5c6b84;
      --line:#233149; --hard:#5b9dff; --lazy:#e5a13f; --import:#22c7e0; --host:#5c6b84;
      --shadow:0 1px 2px rgba(0,0,0,.45),0 18px 44px -18px rgba(0,0,0,.75);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:28px 20px;
  }
  .board{
    width:100%; max-width:1500px; background:var(--panel); border:1px solid var(--line);
    border-radius:22px; box-shadow:var(--shadow); padding:14px 18px; overflow-x:auto;
  }
  svg{display:block; width:100%; min-width:1180px; height:auto}

  .colhead{font:600 10px ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;
    fill:var(--faint); letter-spacing:.22em}
  .colrule{stroke:var(--line);stroke-width:1;stroke-dasharray:3 7}

  .card{fill:var(--panel);stroke:var(--line);stroke-width:1.4;filter:url(#soft)}
  .pkg{font:600 11.5px ui-monospace,"Cascadia Code",Consolas,monospace;fill:var(--ink)}
  .role{font:400 10.5px ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;fill:var(--muted)}
  .iface{font:400 10px ui-monospace,"Cascadia Code",Consolas,monospace;fill:var(--faint)}
  .core .pkg{font-size:13px}
  .core .iface{font-size:10.5px;fill:var(--muted)}
  .core .role{font-size:11.5px}
  .dot{stroke:none}
  .divider{stroke:var(--line);stroke-width:1}

  .hostbox{fill:var(--panel);stroke:var(--host);stroke-width:1.6;stroke-dasharray:7 5;filter:url(#soft)}
  .hostname{font:700 17px ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;fill:var(--ink)}
  .hostsub{font:400 10px ui-monospace,Consolas,monospace;fill:var(--faint);letter-spacing:.08em}

  .shellbox{fill:var(--panel);stroke:var(--import);stroke-width:1.6;stroke-dasharray:7 5;filter:url(#soft)}
  .shellname{font:700 13px ui-monospace,"Cascadia Code",Consolas,monospace;fill:var(--ink)}
  .shellrole{font:400 11.5px ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;fill:var(--muted)}

  .edge{fill:none;stroke-linejoin:round;stroke-linecap:round;transition:opacity .15s ease}
  .edge.hard{stroke:var(--hard);stroke-width:2}
  .edge.lazy{stroke:var(--lazy);stroke-width:2;stroke-dasharray:7 6}
  .edge.import{stroke:var(--import);stroke-width:2;stroke-dasharray:1.5 6}
  .edge.host{stroke:var(--host);stroke-width:1.7;opacity:.9}
  .edge.dimmed{opacity:.10}
  .edge.hot{stroke-width:3.4;filter:url(#glow)}

  .legendbox{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
  .legendtext{font:400 10px ui-monospace,Consolas,monospace;fill:var(--muted)}
  .legendcap{font:600 9.5px ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;
    fill:var(--faint);letter-spacing:.2em}

  .node{cursor:pointer}
  .node.dimmed{opacity:.25}
  .node.rel .card,.node.rel .hostbox,.node.rel .shellbox{stroke-width:2.2}
  .node.hot .card,.node.hot .hostbox,.node.hot .shellbox{stroke-width:2.8}
</style>
</head>
<body>
<div class="board">
<svg viewBox="0 0 1420 780" role="img" aria-label="zhiyun-pro-js 插件依赖图：宿主、能力包、加工包、领域状态与共享原语、界面外壳与页面包">
  <defs>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="180%">

    </filter>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">

    <marker id="a-hard" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--hard)"/></marker>
    <marker id="a-lazy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--lazy)"/></marker>
    <marker id="a-import" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--import)"/></marker>
    <marker id="a-host" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--host)"/></marker>
  </defs>

  <!-- ── 列 ── -->
  <g>
    <text class="colhead" x="115" y="34" text-anchor="middle">宿主</text>
    <text class="colhead" x="350" y="34" text-anchor="middle">能力包</text>
    <text class="colhead" x="615" y="34" text-anchor="middle">加工包</text>
    <text class="colhead" x="895" y="34" text-anchor="middle">领域状态 · 共享原语</text>
    <text class="colhead" x="1245" y="34" text-anchor="middle">界面外壳 · 页面包</text>
    <line class="colrule" x1="215" y1="78" x2="215" y2="726"/>
    <line class="colrule" x1="478" y1="78" x2="478" y2="726"/>
    <line class="colrule" x1="745" y1="78" x2="745" y2="726"/>
    <line class="colrule" x1="1048" y1="78" x2="1048" y2="726"/>

  <!-- ── 边：方向 = 依赖方向（左提供 → 右使用） ── -->
  <g id="edges">

    <path class="edge host" data-from="host" data-to="parser" marker-end="url(#a-host)" d="M190,350 C222,350 222,258 250,258"/>
    <path class="edge host" data-from="host" data-to="knowledge" marker-end="url(#a-host)" d="M190,390 C222,390 222,373 250,373"/>
    <path class="edge host" data-from="host" data-to="final-pass" marker-end="url(#a-host)" d="M190,440 C222,440 222,488 250,488"/>
    <path class="edge host" data-from="host" data-to="notes" marker-end="url(#a-host)" d="M190,455 H212 V580 H500 V503 H515"/>

</div>

<script>
(function () {
  const nodes = Array.from(document.querySelectorAll('g.node'));
  const links = Array.from(document.querySelectorAll('path.edge'))
    .map((el) => ({ el, from: el.dataset.from, to: el.dataset.to }));

  const clear = () => {
    nodes.forEach((n) => n.classList.remove('hot', 'rel', 'dimmed'));
    links.forEach((l) => l.el.classList.remove('hot', 'dimmed'));
  };

  const focusOn = (id) => {
    const related = new Set([id]);
    links.forEach((l) => {
      if (l.from === id) related.add(l.to);
      if (l.to === id) related.add(l.from);
    });
    nodes.forEach((n) => {
      const self = n.dataset.id === id;
      n.classList.toggle('hot', self);
      n.classList.toggle('rel', !self && related.has(n.dataset.id));
      n.classList.toggle('dimmed', !related.has(n.dataset.id));
    });
    links.forEach((l) => {
      const on = l.from === id || l.to === id;
      l.el.classList.toggle('hot', on);
      l.el.classList.toggle('dimmed', !on);
    });
  };

  nodes.forEach((n) => {
    n.addEventListener('mouseenter', () => focusOn(n.dataset.id));
    n.addEventListener('mouseleave', clear);
    n.addEventListener('focus', () => focusOn(n.dataset.id));
    n.addEventListener('blur', clear);
    n.setAttribute('tabindex', '0');
  });
})();
</script>
</body>
</html>
